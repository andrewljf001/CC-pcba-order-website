<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCBAForge Blog</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb;--bg2:#ffffff;--bg3:#f8fafc;--dim:#f0fdf4;
  --border:#d9e2ee;--line:#d9e2ee;
  --green:#16a34a;--green2:#11843d;--green3:#7fd69a;
  --text:#334155;--muted:#64748b;--white:#142033;--ink:#142033;
  --amber:#b7791f;--red:#dc2626;--wa:#25d366;
  --shadow:0 16px 44px rgba(20,32,51,.08);--shadow-sm:0 8px 22px rgba(20,32,51,.06);
  --max:780px;
  --font:'DM Sans',Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--font);background:radial-gradient(circle at 85% 1%,rgba(22,163,74,.08),transparent 24%),linear-gradient(180deg,#fff 0,#f6f8fb 320px,#f6f8fb 100%);color:var(--text);line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 5%;height:68px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 10px 28px rgba(20,32,51,.05)}
.nav-logo{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:1.08rem;font-weight:900;letter-spacing:-.02em}
.ldot{position:relative;width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 8px 18px rgba(22,163,74,.25);animation:none}
.ldot::after{content:"P";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.84rem;font-weight:900;line-height:1}
.nav-links{list-style:none;display:flex;gap:1.8rem}
.nav-links a{font-size:.9rem;color:var(--muted);font-weight:700;transition:color .2s}.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-cta{background:var(--green);color:#fff;border-radius:7px;font-size:.85rem;font-weight:800;padding:.55rem 1.15rem;box-shadow:0 12px 22px rgba(22,163,74,.18);transition:background .2s}.nav-cta:hover{background:var(--green2)}
.article-wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:3rem 5% 4rem}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.84rem;color:var(--muted);font-weight:700;margin-bottom:2rem;transition:color .2s}
.back-link:hover{color:var(--green2)}
.article-tags{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.article-tag{font-size:.66rem;font-weight:800;color:var(--green2);background:#dcfce7;border:1px solid #bbf7d0;border-radius:999px;padding:.2rem .6rem}
.article-title{color:var(--ink);font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1;letter-spacing:-.035em;font-weight:900;margin-bottom:1rem}
.article-meta{display:flex;gap:1.5rem;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:2rem;flex-wrap:wrap}
.article-cover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:2.5rem;box-shadow:var(--shadow)}
.article-content{font-size:1.05rem;line-height:1.85;color:var(--text)}
.article-content h2{color:var(--ink);font-size:1.5rem;font-weight:900;letter-spacing:-.02em;margin:2.2rem 0 .9rem}
.article-content h3{color:var(--ink);font-size:1.2rem;font-weight:800;margin:1.8rem 0 .7rem}
.article-content p{margin-bottom:1.3rem}
.article-content ul,.article-content ol{margin:0 0 1.3rem 1.4rem}
.article-content li{margin-bottom:.5rem}
.article-content a{color:var(--green2);font-weight:600;text-decoration:underline}
.article-content strong{color:var(--ink);font-weight:700}
.article-content img{max-width:100%;border-radius:12px;margin:1.5rem 0}
.article-content blockquote{border-left:3px solid var(--green);background:#f0fdf4;padding:1rem 1.3rem;border-radius:0 10px 10px 0;margin:1.5rem 0;color:var(--text)}
.article-content code{background:#f1f5f9;border:1px solid var(--line);border-radius:5px;padding:.1rem .4rem;font-size:.9em}
.article-cta{background:linear-gradient(135deg,#08331c,#0f5132);border-radius:14px;padding:2.5rem;text-align:center;margin-top:3rem;box-shadow:var(--shadow)}
.article-cta-title{color:#fff;font-size:1.4rem;font-weight:900;letter-spacing:-.02em;margin-bottom:.6rem}
.article-cta-sub{color:#d7fbe0;font-size:.95rem;margin-bottom:1.5rem}
.article-cta-btns{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap}
.btn-green{display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;border-radius:8px;font-size:.9rem;font-weight:800;padding:.8rem 1.8rem;box-shadow:0 12px 22px rgba(22,163,74,.25);transition:background .2s}
.btn-green:hover{background:var(--green2)}
.btn-outline{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-size:.9rem;font-weight:800;padding:.8rem 1.8rem;transition:all .2s}
.btn-outline:hover{background:rgba(255,255,255,.1)}
.state-wrap{text-align:center;padding:5rem 0}
.state-icon{font-size:3rem;margin-bottom:1rem;opacity:.4}
.state-title{font-size:1.1rem;color:var(--ink);font-weight:800;margin-bottom:.5rem}
.state-sub{font-size:.88rem;color:var(--muted)}
.loading-dot{display:inline-block;width:9px;height:9px;background:var(--green);border-radius:50%;margin:0 3px;animation:blink 1.2s infinite}
.loading-dot:nth-child(2){animation-delay:.2s}.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
footer{position:relative;z-index:1;background:#fff;border-top:1px solid var(--line);padding:2.5rem 5%}
.fi{max-width:var(--max);margin:0 auto;text-align:center}
.flogo{color:var(--green2);font-size:1rem;font-weight:900;margin-bottom:.8rem}
.flinks{display:flex;justify-content:center;gap:1.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.flinks a{font-size:.84rem;color:var(--muted)}.flinks a:hover{color:var(--ink)}
.flinks2{display:flex;justify-content:center;gap:1.5rem;margin-bottom:1rem;flex-wrap:wrap}
.flinks2 a{font-size:.75rem;color:var(--muted)}.flinks2 a:hover{color:var(--ink)}
.fcopy{font-size:.75rem;color:var(--muted)}
.waf{position:fixed;bottom:2rem;right:2rem;width:56px;height:56px;background:var(--wa);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(37,211,102,.25);z-index:999;transition:transform .2s}.waf:hover{transform:scale(1.08)}
@media(max-width:768px){nav{height:60px;padding:0 4%}.nav-links{display:none}.article-wrap{padding:2rem 5% 3rem}.article-content{font-size:1rem}.article-cta{padding:2rem 1.5rem}}

</style>

</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span class="ldot"></span>PCBAForge</a>
  <ul class="nav-links">
    <li><a href="index.html#quote">Quote</a></li>
    <li><a href="index.html#services">Services</a></li>
    <li><a href="index.html#capabilities">Capabilities</a></li>
    <li><a href="blog.html" class="active">Blog</a></li>
    <li><a href="track.html">Track Order</a></li>
  </ul>
  <a href="quote.html" class="nav-cta">GET QUOTE</a>
</nav>

<div class="article-wrap" id="article-wrap">
  <div class="state-wrap">
    <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>
  </div>
</div>

<footer>
  <div class="fi">
    <div class="flogo">▶ PCBAForge</div>
    <div class="flinks">
      <a href="index.html#services">Services</a><a href="index.html#quote">Quick Estimator</a>
      <a href="blog.html">Blog</a><a href="quote.html">Submit Inquiry</a><a href="track.html">Track Order</a>
    </div>
    <div class="fcopy">© 2026 PCBAForge · PCB Fabrication · SMT Assembly · Full Turnkey · Functional Testing · Worldwide</div>
  </div>
</footer>

<a href="https://wa.me/" class="waf" target="_blank" aria-label="WhatsApp">
  <svg width="28" height="28" viewBox="0 0 32 32" fill="white"><path d="M16 0C7.164 0 0 7.163 0 16c0 2.822.736 5.469 2.018 7.773L0 32l8.418-2.207A15.93 15.93 0 0016 32c8.836 0 16-7.163 16-16S24.836 0 16 0zm8.078 22.418c-.336.943-1.965 1.805-2.703 1.918-.691.105-1.559.15-2.514-.158-.578-.188-1.32-.438-2.268-.857-3.992-1.723-6.602-5.73-6.801-5.994-.199-.264-1.625-2.162-1.625-4.125s1.027-2.926 1.393-3.328c.363-.402.793-.502 1.059-.502.264 0 .527.002.758.014.242.012.568-.092.889.678.336.801 1.143 2.764 1.242 2.963.1.199.166.43.033.693-.133.264-.199.43-.398.662-.199.232-.418.519-.596.697-.199.199-.406.414-.175.812.232.398 1.031 1.699 2.213 2.748 1.52 1.355 2.801 1.773 3.199 1.973.398.199.629.166.861-.1.232-.264.994-1.162 1.26-1.561.264-.398.527-.332.889-.199.363.133 2.309 1.09 2.707 1.287.398.199.662.299.762.465.1.166.1.963-.236 1.906z"/></svg>
</a>

<script>
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : ''; }

function esc(s){ var d=document.createElement('div');d.textContent=s;return d.innerHTML; }

async function loadPost(){
  var params=new URLSearchParams(location.search);
  var slug=params.get('slug');
  var wrap=document.getElementById('article-wrap');

  if(!slug){
    wrap.innerHTML='<div class="state-wrap"><div class="state-icon">🔍</div><div class="state-title">NO ARTICLE SPECIFIED</div><div class="state-sub"><a href="blog.html" style="color:var(--green)">← Back to Blog</a></div></div>';
    return;
  }

  try{
    var res=await fetch('/api/posts/'+encodeURIComponent(slug));
    if(!res.ok) throw new Error('Article not found');
    var p=await res.json();

    // Update page title & meta
    document.title=p.title+' — PCBAForge Blog';
    document.querySelector('meta[name="description"]').setAttribute('content',p.excerpt||p.title);

    var tags=[];try{tags=JSON.parse(p.tags||'[]');}catch(e){}
    var tagsHtml=tags.map(function(t){return '<span class="article-tag">'+esc(t)+'</span>';}).join('');

    wrap.innerHTML=
      '<a href="blog.html" class="back-link">← BACK TO BLOG</a>'+
      (tagsHtml?'<div class="article-tags">'+tagsHtml+'</div>':'')+
      '<h1 class="article-title">'+esc(p.title)+'</h1>'+
      '<div class="article-meta">'+
        '<span>✍ '+esc(p.author||'PCBAForge Team')+'</span>'+
        '<span>📅 '+fmtDate(p.published_at)+'</span>'+
        '<span>👁 '+((p.views||0))+'</span>'+
      '</div>'+
      (p.cover_url?'<img class="article-cover" src="'+esc(p.cover_url)+'" alt="'+esc(p.title)+'">':'')+
      '<div class="article-content" id="post-content"></div>'+
      '<div class="article-cta">'+
        '<div class="article-cta-title">Ready to build your PCBA?</div>'+
        '<div class="article-cta-sub">Get an instant quote or submit your Gerber + BOM files to our engineers.</div>'+
        '<div class="article-cta-btns">'+
          '<a href="index.html#quote" class="btn-green">⬆ GET INSTANT QUOTE</a>'+
          '<a href="quote.html" class="btn-outline">SUBMIT INQUIRY →</a>'+
        '</div>'+
      '</div>';

    // Render content — supports HTML content
    document.getElementById('post-content').innerHTML = p.content || '';

  }catch(e){
    wrap.innerHTML='<div class="state-wrap"><div class="state-icon">📡</div><div class="state-title">ARTICLE NOT FOUND</div><div class="state-sub">'+esc(e.message)+'<br><br><a href="blog.html" style="color:var(--green)">← Back to Blog</a></div></div>';
  }
}

loadPost();
</script>
<script>
(function(){
  var wafEl = document.querySelector('.waf');
  var bwaEl = document.querySelector('.bwa');
  var waLinks = document.querySelectorAll('[href^="https://wa.me"]');
  // 先隐藏所有 WA 按钮
  if(wafEl) wafEl.style.display='none';
  if(bwaEl) bwaEl.style.display='none';
  fetch('/api/settings/public').then(function(r){return r.json();}).then(function(cfg){
    var wa = (cfg.whatsapp_number||'').replace(/[^0-9]/g,'');
    if(!wa) return;
    waLinks.forEach(function(el){
      var orig = el.href;
      var text = orig.includes('?text=') ? orig.split('?text=')[1] : '';
      el.href = 'https://wa.me/' + wa + (text ? '?text='+text : '');
    });
    if(wafEl) wafEl.style.display='';
    if(bwaEl) bwaEl.style.display='';
  }).catch(function(){});
})();
</script>
