<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCBAForge Blog</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#FFFFFF;--bg3:#F7F8FA;--dim:#F2F3F5;--border:#E3E5E9;--green:#16A34A;--green2:#00C832;--green3:#008F24;--text:#C8E6C9;--muted:#5A7A5A;--white:#E8F5E9;--amber:#FFB300;--red:#FF4444;--wa:#25D366;--max:860px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 5%;height:60px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(10px);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.nav-logo{font-family:'Inter',sans-serif;font-size:1.05rem;color:var(--green);letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.ldot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(22,163,74,.25)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.nav-links{list-style:none;display:flex;gap:2rem}.nav-links a{font-size:.84rem;letter-spacing:.06em;color:var(--muted);transition:color .2s}.nav-links a:hover,.nav-links a.active{color:var(--green)}
.nav-cta{background:var(--green);color:#fff;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;padding:.45rem 1.2rem;transition:opacity .2s}.nav-cta:hover{opacity:.85}
/* Article */
.article-wrap{max-width:var(--max);margin:0 auto;padding:3rem 5% 5rem}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-family:'Inter',sans-serif;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:2rem;transition:color .2s}
.back-link:hover{color:var(--green)}
.article-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.article-tag{font-family:'Inter',sans-serif;font-size:.65rem;letter-spacing:.1em;color:var(--green);border:1px solid var(--green3);padding:.2rem .6rem}
.article-title{font-family:'Inter',sans-serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--white);line-height:1.2;margin-bottom:1rem;font-weight:700}
.article-meta{display:flex;gap:1.5rem;font-family:'Inter',sans-serif;font-size:.7rem;color:var(--muted);margin-bottom:2rem;flex-wrap:wrap}
.article-meta span{display:flex;align-items:center;gap:.3rem}
.article-cover{width:100%;max-height:420px;object-fit:cover;display:block;filter:brightness(.75) saturate(1.1);border:1px solid var(--border);margin-bottom:2.5rem}
/* Content styles */
.article-content{font-size:.95rem;line-height:1.85;color:var(--text)}
.article-content h1,.article-content h2,.article-content h3{font-family:'Inter',sans-serif;color:var(--white);margin:2rem 0 .75rem}
.article-content h1{font-size:1.4rem}.article-content h2{font-size:1.15rem}.article-content h3{font-size:1rem}
.article-content p{margin-bottom:1.2rem}
.article-content ul,.article-content ol{margin:0 0 1.2rem 1.5rem}
.article-content li{margin-bottom:.4rem}
.article-content code{font-family:'Inter',sans-serif;font-size:.85em;background:var(--dim);border:1px solid var(--border);padding:.1rem .4rem;color:var(--green)}
.article-content pre{background:var(--dim);border:1px solid var(--border);border-left:3px solid var(--green3);padding:1.2rem;overflow-x:auto;margin-bottom:1.2rem}
.article-content pre code{background:none;border:none;padding:0;font-size:.85rem}
.article-content blockquote{border-left:3px solid var(--green3);padding:.5rem 1rem;margin:0 0 1.2rem;background:rgba(22,163,74,.03);color:var(--muted);font-style:italic}
.article-content a{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.article-content a:hover{color:var(--green2)}
.article-content img{max-width:100%;height:auto;display:block;margin:1.5rem 0;border:1px solid var(--border)}
.article-content table{width:100%;border-collapse:collapse;margin-bottom:1.2rem;font-size:.88rem}
.article-content th{background:var(--dim);padding:.6rem .9rem;text-align:left;font-family:'Inter',sans-serif;font-size:.72rem;color:var(--green);letter-spacing:.08em;border:1px solid var(--border)}
.article-content td{padding:.55rem .9rem;border:1px solid var(--border)}
.article-content tr:nth-child(even) td{background:rgba(0,0,0,.018)}
.article-content hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
/* CTA box */
.article-cta{margin-top:3rem;background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--green3);padding:1.5rem}
.article-cta-title{font-family:'Inter',sans-serif;font-size:.9rem;color:var(--white);margin-bottom:.5rem}
.article-cta-sub{font-size:.83rem;color:var(--muted);margin-bottom:1rem}
.article-cta-btns{display:flex;gap:.8rem;flex-wrap:wrap}
.btn-green{background:var(--green);color:#fff;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:.6rem 1.4rem;transition:opacity .2s;display:inline-block}.btn-green:hover{opacity:.85}
.btn-outline{border:1px solid var(--green3);color:var(--green);font-size:.82rem;padding:.6rem 1.2rem;transition:all .2s;display:inline-block}.btn-outline:hover{background:rgba(22,163,74,.07)}
/* Loading / Error */
.state-wrap{text-align:center;padding:6rem 0}
.state-icon{font-size:3rem;margin-bottom:1rem;opacity:.3}
.state-title{font-family:'Inter',sans-serif;font-size:1rem;color:var(--muted);margin-bottom:.5rem}
.state-sub{font-size:.83rem;color:var(--muted)}
.loading-dot{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;margin:0 4px;animation:blink 1.2s infinite}
.loading-dot:nth-child(2){animation-delay:.2s}.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
/* Footer */
footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:2.5rem 5%}
.fi{max-width:1200px;margin:0 auto;text-align:center}
.flogo{font-family:'Inter',sans-serif;font-size:1rem;color:var(--green);letter-spacing:.12em;margin-bottom:.8rem}
.flinks{display:flex;justify-content:center;gap:2rem;margin-bottom:1rem;flex-wrap:wrap}
.flinks a{font-size:.82rem;color:var(--muted);transition:color .2s}.flinks a:hover{color:var(--green)}
.fcopy{font-size:.75rem;color:var(--muted)}
.waf{position:fixed;bottom:2rem;right:2rem;width:56px;height:56px;background:var(--wa);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.18);z-index:999;transition:transform .2s}.waf:hover{transform:scale(1.1)}
@media(max-width:768px){.nav-links{display:none}.article-title{font-size:1.4rem}}

/* ===== white-business v2: rounded + shadow + green ===== */
.nav-cta,.bp,.bg,.obtn,.bwa,.bem,.search-btn,.act-btn,.track-btn,
button[type=submit],.pay-btn{border-radius:8px}
.fg select,.fg input,.fg textarea,.search-row input,
input,select,textarea{border-radius:6px}
.sc,.qform,.qres,.card,.pay-card,.wc,.svc-card,.search-card,.order-top,
.timeline-card,.note-card,.price-block,.msg-box,.success-box,.detail-panel .sub-body,
.info-block,.warn-block,.radio-block,.manual-notice,.pay-card,.hero-img-wrap,
.hpanel .fbody{border-radius:12px}
.sc,.card,.pay-card,.wc,.search-card,.order-top,.timeline-card,
.price-block{box-shadow:0 1px 3px rgba(16,24,40,.04),0 1px 2px rgba(16,24,40,.06)}
.sptbl{border-radius:12px;overflow:hidden}
.svc-card{border-radius:10px}
.pn,.tl-dot{border-radius:50%}
.status-pill{border-radius:999px}
.stag,.svc-badge,.pay-tag,.badge-std,.badge-rq{border-radius:6px}
</style>

<script>
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : ''; }

function esc(s){ var d=document.createElement('div');d.textContent=s;return d.innerHTML; }

async function loadPost(){
  var params=new URLSearchParams(location.search);
  var slug=params.get('slug');
  var wrap=document.getElementById('article-wrap');

  if(!slug){
    wrap.innerHTML='<div class="state-wrap"><div class="state-icon">🔍</div><div class="state-title">NO ARTICLE SPECIFIED</div><div class="state-sub"><a href="blog.html" style="color:var(--green)">← Back to Blog</a></div></div>';
    return;
  }

  try{
    var res=await fetch('/api/posts/'+encodeURIComponent(slug));
    if(!res.ok) throw new Error('Article not found');
    var p=await res.json();

    // Update page title & meta
    document.title=p.title+' — PCBAForge Blog';
    document.querySelector('meta[name="description"]').setAttribute('content',p.excerpt||p.title);

    var tags=[];try{tags=JSON.parse(p.tags||'[]');}catch(e){}
    var tagsHtml=tags.map(function(t){return '<span class="article-tag">'+esc(t)+'</span>';}).join('');

    wrap.innerHTML=
      '<a href="blog.html" class="back-link">← BACK TO BLOG</a>'+
      (tagsHtml?'<div class="article-tags">'+tagsHtml+'</div>':'')+
      '<h1 class="article-title">'+esc(p.title)+'</h1>'+
      '<div class="article-meta">'+
        '<span>✍ '+esc(p.author||'PCBAForge Team')+'</span>'+
        '<span>📅 '+fmtDate(p.published_at)+'</span>'+
        '<span>👁 '+((p.views||0))+'</span>'+
      '</div>'+
      (p.cover_url?'<img class="article-cover" src="'+esc(p.cover_url)+'" alt="'+esc(p.title)+'">':'')+
      '<div class="article-content" id="post-content"></div>'+
      '<div class="article-cta">'+
        '<div class="article-cta-title">Ready to build your PCBA?</div>'+
        '<div class="article-cta-sub">Get an instant quote or submit your Gerber + BOM files to our engineers.</div>'+
        '<div class="article-cta-btns">'+
          '<a href="index.html#quote" class="btn-green">⬆ GET INSTANT QUOTE</a>'+
          '<a href="quote.html" class="btn-outline">SUBMIT INQUIRY →</a>'+
        '</div>'+
      '</div>';

    // Render content — supports HTML content
    document.getElementById('post-content').innerHTML = p.content || '';

  }catch(e){
    wrap.innerHTML='<div class="state-wrap"><div class="state-icon">📡</div><div class="state-title">ARTICLE NOT FOUND</div><div class="state-sub">'+esc(e.message)+'<br><br><a href="blog.html" style="color:var(--green)">← Back to Blog</a></div></div>';
  }
}

loadPost();
</script>
<script>
(function(){
  var wafEl = document.querySelector('.waf');
  var bwaEl = document.querySelector('.bwa');
  var waLinks = document.querySelectorAll('[href^="https://wa.me"]');
  // 先隐藏所有 WA 按钮
  if(wafEl) wafEl.style.display='none';
  if(bwaEl) bwaEl.style.display='none';
  fetch('/api/settings/public').then(function(r){return r.json();}).then(function(cfg){
    var wa = (cfg.whatsapp_number||'').replace(/[^0-9]/g,'');
    if(!wa) return;
    waLinks.forEach(function(el){
      var orig = el.href;
      var text = orig.includes('?text=') ? orig.split('?text=')[1] : '';
      el.href = 'https://wa.me/' + wa + (text ? '?text='+text : '');
    });
    if(wafEl) wafEl.style.display='';
    if(bwaEl) bwaEl.style.display='';
  }).catch(function(){});
})();
</script>
