server {
    listen 80;
    server_name pcbaforge.com www.pcbaforge.com;
    client_max_body_size 210m;

    location ~ ^/(quote|contact|track|blog|shipping|privacy|terms)\.html$ {
        return 301 https://pcbaforge.com/$1$is_args$args;
    }

    location / {
        return 301 https://pcbaforge.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.pcbaforge.com;
    client_max_body_size 210m;
    ssl_certificate /etc/letsencrypt/live/pcbaforge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcbaforge.com/privkey.pem;

    location ~ ^/(quote|contact|track|blog|shipping|privacy|terms)\.html$ {
        return 301 https://pcbaforge.com/$1$is_args$args;
    }

    location / {
        return 301 https://pcbaforge.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pcbaforge.com;
    client_max_body_size 210m;

    ssl_certificate /etc/letsencrypt/live/pcbaforge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcbaforge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    location ~ ^/api/admin/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        client_max_body_size 210m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    include snippets/webp.conf;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|css|js)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
